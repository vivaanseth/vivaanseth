<svg xmlns="http://www.w3.org/2000/svg" width="486" height="71"
viewBox="0 0 486 71"
font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<defs>
  <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111722"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
</defs>

<path d="M0 0 H486 V59 Q486 71 474 71 H12 Q0 71 0 59Z"
      fill="url(#wbg)"/>
<path d="M.5 0 V59 Q.5 70.5 12 70.5 H474
         Q485.5 70.5 485.5 59 V0"
      fill="none" stroke="#30363d"/>

<line x1="18" y1=".5" x2="468" y2=".5"
      stroke="#30363d" opacity="0.8"/>

<clipPath id="wipe">
  <rect x="18" y="12" height="40" width="0">
    <animate attributeName="width"
             from="0" to="450"
             begin="0s" dur="1.60s" fill="freeze"/>
  </rect>
</clipPath>

<g clip-path="url(#wipe)">
  <text x="18" y="35" fill="#7d8590" font-size="11.5"
        textLength="117" lengthAdjust="spacing">
    vivaan@github: ~$
  </text>

  <!-- Cursor moved to the actual end of the prompt -->
  <rect x="141" y="24" width="7" height="14" fill="#c9d1d9">
    <animate attributeName="opacity"
             values="1;1;0;0"
             keyTimes="0;0.5;0.51;1"
             dur="1s"
             begin="1.6s"
             repeatCount="indefinite"/>
  </rect>
</g>
</svg>